<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Reimbursement</title>
  <!-- Rubric: Separate styles.css linked correctly (2 pts) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <h1>Expense Reimbursement</h1>
      <p class="subtitle">Submit one business expense for reimbursement.</p>
    </header>

    <main>
      <section class="instructions-card">
        <h2>Before You Submit</h2>
        <p>
          Complete the required fields below.
          Keep your receipt available when company policy requires one.
        </p>
      </section>
      <section class="form-card">
        <h2>Expense Details</h2>

        <form method="get">
          <fieldset>
            <legend>Expense Information</legend>

            <div class="form-group">
              <label for="employeeId">Employee ID</label>
              <input id="employeeId" name="employeeId" type="text" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="expenseDate">Expense Date</label>
              <input id="expenseDate" name="expenseDate" type="date" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category" class="form-control" required>
                <option value="">Choose a category</option>
                <option value="travel">Travel</option>
                <option value="meals">Meals</option>
                <option value="supplies">Supplies</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="amount">Expense Amount ($)</label>
              <input id="amount" name="amount" type="number" class="form-control" required min="0.01" step="0.01">
            </div>

            <div class="form-group">
              <label for="description">Business Purpose / Description</label>
              <textarea id="description" name="description" rows="4" cols="45" class="form-control" required></textarea>
            </div>

            <div class="checkbox-group">
              <input id="receiptAttached" name="receiptAttached" type="checkbox" value="yes">
              <label for="receiptAttached">Receipt attached</label>
            </div>
          </fieldset>

          <button type="submit" class="submit-btn">Submit Request</button>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p>MIS 3371 — Week 4 Live Demo</p>
    </footer>
  </div>

</body>
</html>
